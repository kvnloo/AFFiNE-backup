[workspace]
resolver = "3"
members = ["."]

[package]
name = "blocksuite-preview"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["mermaid", "math", "typst", "pdf"]
mermaid = ["dep:merman"]
math = [
    "dep:ratex-parser",
    "dep:ratex-layout",
    "dep:ratex-svg",
    "dep:ratex-types",
]
typst = [
    "dep:typst",
    "dep:typst-layout",
    "dep:typst-svg",
]
pdf = ["dep:hayro"]
wasm-worker = ["dep:wasm-bindgen"]

[dependencies]
resvg = { version = "0.46.0", default-features = false, features = ["text", "raster-images"] }
usvg = { version = "0.46.0", default-features = false, features = ["text"] }
sha2 = "0.10"
thiserror = "2.0.12"
ttf-parser = "0.25"

# Mermaid
merman = { version = "0.11.0", optional = true }

# LaTeX Math (RaTeX KaTeX-compatible engine with embedded vector glyph outlines)
ratex-parser = { version = "0.1.16", optional = true }
ratex-layout = { version = "0.1.16", optional = true }
ratex-svg = { version = "0.1.16", features = ["embed-fonts"], optional = true }
ratex-types = { version = "0.1.16", optional = true }

# Typst native block compiler
typst = { version = "0.15.1", optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-svg = { version = "0.15.1", optional = true }

# PDF
hayro = { version = "0.9.0", optional = true }

# Wasm worker entry points
wasm-bindgen = { version = "0.2.120", optional = true }

[dev-dependencies]
mitex = "0.2.4"
typst-assets = { version = "0.15.1", features = ["fonts"] }
ratex-katex-fonts = "0.1.16"

[lints.rust]
unexpected_cfgs = { level = "deny" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
